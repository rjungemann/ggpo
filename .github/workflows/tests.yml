name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DGGPO_BUILD_VECTORWAR=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test (non-Windows)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure -E ggpo_integration_tests
